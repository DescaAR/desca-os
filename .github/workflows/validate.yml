name: Validate Desca OS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate required files
        run: |
          test -f index.html
          test -f styles.css
          test -f manifest.webmanifest
          test -f sw.js
