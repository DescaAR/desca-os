<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand-wrap">
        <button class="brand" data-route="today" aria-label="Open Home">
          <span class="brand-mark">D</span>
          <span class="brand-copy"><strong>Desca OS</strong><small>Learn. Track. Grow.</small></span>
        </button>
        <button class="icon-btn sidebar-toggle" id="sidebarToggle" title="Collapse sidebar" aria-label="Collapse sidebar">←</button>
      </div>
      <nav id="sideNav"></nav>
      <div class="sidebar-footer">
        <div class="mini-level">
          <div class="mini-level-top"><span>Level <b id="sideLevel">1</b></span><span id="sideXP">0 XP</span></div>
          <div class="progress-line"><span id="sideXPBar"></span></div>
        </div>
        <button class="profile-chip" data-route="settings"><span class="avatar">DA</span><span><b>Desca</b><small>Personal workspace</small></span></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>

          <div class="crumb" id="crumb">Home</div>

        <div class="top-actions">
          <button class="guide-top-btn" data-act="openPageGuide" aria-label="Open page guide"><span>?</span><b>Guide</b></button>
          <button class="search-btn" id="searchOpen"><span>⌕</span><span class="search-label">Search Desca OS</span><kbd>⌘ K</kbd></button>
          <button class="icon-btn notification-bell" id="notificationBell" aria-label="Notifications" title="Notifications"><span aria-hidden="true">◦</span><b id="notificationBadge" hidden></b></button>
          <button class="icon-btn" id="themeToggle" aria-label="Toggle colour theme" title="Toggle colour theme">☾</button>
          <button class="btn btn-primary" id="quickAdd">＋ Log Activity</button>
        </div>
      </header>
      <div class="page" id="page"></div>
    </main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>
    <button class="mobile-fab" id="mobileFab" aria-label="Log activity">＋</button>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>
