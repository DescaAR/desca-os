name: Validate Desca OS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check modules/growth-utils.js
      - name: Validate required files
        run: |
          test -f index.html
          test -f styles.css
          test -f manifest.webmanifest
          test -f sw.js
          test -f modules/growth-utils.js
          grep -q 'modules/growth-utils.js' index.html
          grep -q 'function taskXP' app.js
          grep -q 'function activityXP' app.js
          grep -q 'function nowNextCard' app.js
          grep -q 'function nowNextPick' app.js
          grep -q 'function startRoutineTimer' app.js
          grep -q 'Unified typography system' ui-v21.css
          grep -q 'const CONSISTENCY_TIERS' app.js
          grep -q 'function consistencyBadgeSection' app.js
          grep -q 'Consistency badge system' ui-v21.css
          grep -q 'const DILIGENCE_RANKS' app.js
          grep -q 'function diligenceMainBadgeCard' app.js
          grep -q 'function requestGoogleToken' app.js
          grep -q 'function googleFriendlyError' app.js
          grep -q 'Google OAuth diagnostics' ui-v21.css
          grep -q 'Productivity RPG system' ui-v21.css
          grep -q 'Paper Library PDF attachments' ui-v21.css
          grep -q 'function openPaperPDF' app.js
          grep -q 'function saveResearchPaperForm' app.js
          grep -q 'function paperFilesDB' app.js
          grep -q 'function syncGameRewards' app.js
          grep -q 'function replanRemainingDay' app.js
          grep -q 'function activityRadarSvg' app.js
          grep -q 'function rankUpOverlayHtml' app.js
          grep -q 'function seasonRankData' app.js
          grep -q 'function dailyQuestData' app.js
          grep -q 'Aggregate diligence rank' ui-v21.css
          grep -q 'Research Intelligence and OS expansion' ui-v21.css
          grep -q 'function syncVaultToDrive' app.js
          grep -q 'function syncPaperPDFToDrive' app.js
          grep -q 'function vaultPage' app.js
          grep -q 'function morningCommandScreen' app.js
          grep -q 'function recoveryGuardData' app.js
          grep -q 'function timelinePage' app.js
          grep -q 'function seasonHistoryCard' app.js
          grep -q 'function achievementShowcaseCard' app.js
          grep -q 'function goalForecast' app.js
          grep -q 'function projectHealth' app.js
          grep -q 'function readingQueueCard' app.js
          grep -q 'function researchKnowledgeGraph' app.js
          grep -q 'function openCitationManager' app.js
          grep -q 'function openPaperReader' app.js
