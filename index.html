<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F7FB" />
  <meta name="description" content="Desca OS — personal productivity operating system untuk merencanakan, mencatat, dan memahami perkembangan diri." />
  <title>Desca OS — Track. Improve. Grow.</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=44" />
  <link rel="stylesheet" href="ui-v21.css?v=44" />
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="brand-wrap">
        <button class="brand" data-route="today" aria-label="Buka Today">
          <span class="brand-mark">D</span>
          <span class="brand-copy"><strong>Desca OS</strong><small>Track. Improve. Grow.</small></span>
        </button>
        <button class="icon-btn sidebar-toggle" id="sidebarToggle" title="Ciutkan sidebar" aria-label="Ciutkan sidebar">←</button>
      </div>
      <nav id="sideNav"></nav>
      <div class="sidebar-footer">
        <div class="mini-level">
          <div class="mini-level-top"><span>Level <b id="sideLevel">1</b></span><span id="sideXP">0 XP</span></div>
          <div class="progress-line"><span id="sideXPBar"></span></div>
        </div>
        <button class="profile-chip" data-route="settings"><span class="avatar">DA</span><span><b>Desca</b><small>Personal workspace</small></span></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <button class="mobile-menu icon-btn" id="mobileMenu" aria-label="Buka menu">☰</button>
          <div class="crumb" id="crumb">Today</div>
        </div>
        <div class="top-actions">
          <button class="search-btn" id="searchOpen"><span>⌕</span><span class="search-label">Cari apa pun</span><kbd>⌘ K</kbd></button>
          <button class="icon-btn" id="themeToggle" aria-label="Ubah tema" title="Ubah tema">☾</button>
          <button class="btn btn-primary" id="quickAdd">＋ Quick Add</button>
        </div>
      </header>
      <div class="page" id="page"></div>
    </main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi mobile"></nav>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>
  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
  <script src="modules/growth-utils.js?v=44" defer></script>
  <script src="app.js?v=44" defer></script>
</body>
</html>
