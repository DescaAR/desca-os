name: Validate Desca OS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check runtime-guard.js
          node --check modules/growth-utils.js
          node --check tests/runtime-smoke.js
      - name: Runtime route smoke test
        run: node tests/runtime-smoke.js
      - name: Validate required files
        run: |
          test -f index.html
          test -f runtime-guard.js
          test -f styles.css
          test -f manifest.webmanifest
          test -f sw.js
          test -f modules/growth-utils.js
          grep -q 'modules/growth-utils.js' index.html
          grep -q 'runtime-guard.js?v=80' index.html
          grep -q 'DescaRuntimeGuard' runtime-guard.js
          grep -q 'function taskXP' app.js
          grep -q 'function activityXP' app.js
          grep -q 'function nowNextCard' app.js
          grep -q 'function nowNextPick' app.js
          grep -q 'function startRoutineTimer' app.js
          grep -q 'const DESCA_GOAL_BASELINE' app.js
